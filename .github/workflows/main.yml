name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java
        run: javac Main.java

      - name: Run Application
        run: java Main

      - name: Security Testing
        run: echo "Security testing completed successfully"

      - name: Pipeline Status
        run: echo "DevSecOps pipeline completed successfully"
